<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          "PingFang SC",
          "SF Pro Text",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: transparent;
        color: #111111;
      }

      body {
        margin: 0;
        background: transparent;
      }

      .card {
        box-sizing: border-box;
        width: min(720px, 100%);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        overflow: hidden;
      }

      .header,
      .section,
      .footer {
        padding: 18px 20px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #777777;
        font-size: 13px;
        line-height: 18px;
      }

      h1 {
        margin: 0;
        color: #111111;
        font-size: 20px;
        line-height: 28px;
        letter-spacing: 0;
      }

      .badge {
        flex: 0 0 auto;
        border-radius: 999px;
        background: #111111;
        color: #ffffff;
        font-size: 13px;
        line-height: 18px;
        padding: 8px 12px;
      }

      .section {
        display: grid;
        gap: 12px;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .cell,
      .prompt,
      .thumb {
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        background: #fafafa;
      }

      .cell {
        padding: 12px;
      }

      .label {
        color: #777777;
        font-size: 12px;
        line-height: 18px;
      }

      .value {
        margin-top: 4px;
        color: #111111;
        font-size: 16px;
        font-weight: 650;
        line-height: 22px;
      }

      .prompt {
        max-height: 156px;
        overflow: auto;
        padding: 14px;
        color: #222222;
        font-size: 14px;
        line-height: 22px;
        white-space: pre-wrap;
      }

      .thumb {
        display: none;
        min-height: 160px;
        overflow: hidden;
      }

      .thumb img {
        display: block;
        width: 100%;
        height: 220px;
        object-fit: cover;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
        color: #777777;
        font-size: 13px;
        line-height: 20px;
      }

      @media (max-width: 560px) {
        .meta {
          grid-template-columns: 1fr;
        }

        .header {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #f5f5f5;
        }

        .card {
          border-color: rgba(255, 255, 255, 0.12);
          background: rgba(31, 31, 31, 0.96);
        }

        .header,
        .footer {
          border-color: rgba(255, 255, 255, 0.12);
        }

        h1,
        .value,
        .prompt {
          color: #f5f5f5;
        }

        .cell,
        .prompt,
        .thumb {
          border-color: rgba(255, 255, 255, 0.12);
          background: rgba(255, 255, 255, 0.06);
        }

        .badge {
          background: #f5f5f5;
          color: #111111;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="ASUI Canvas Task Card">
      <header class="header">
        <div>
          <p class="eyebrow">ASUI Canvas</p>
          <h1 data-field="title">ASUI 画布任务卡片</h1>
        </div>
        <div class="badge" data-field="mode">生图/改图</div>
      </header>
      <section class="section">
        <div class="meta">
          <div class="cell">
            <div class="label">状态</div>
            <div class="value" data-field="status">draft</div>
          </div>
          <div class="cell">
            <div class="label">画布上下文</div>
            <div class="value" data-field="context">0 / 0</div>
          </div>
          <div class="cell">
            <div class="label">尺寸</div>
            <div class="value" data-field="size">未指定</div>
          </div>
        </div>
        <div class="thumb" data-field="thumbWrap">
          <img data-field="thumb" alt="ASUI source preview" />
        </div>
        <div class="prompt" data-field="prompt">等待 ASUI 任务数据。</div>
      </section>
      <footer class="footer">
        <span data-field="taskId">尚未绑定任务 ID</span>
        <span>只处理生成任务，不执行代码修改</span>
      </footer>
    </main>
    <script>
      function getPayload() {
        const host = window.openai || {};
        return (
          host.structuredContent ||
          host.toolOutput?.structuredContent ||
          host.toolResult?.structuredContent ||
          host.toolResponse?.structuredContent ||
          {}
        );
      }

      function setText(name, value) {
        const node = document.querySelector(`[data-field="${name}"]`);
        if (node) node.textContent = value || "";
      }

      function render() {
        const payload = getPayload();
        const card = payload.card || payload || {};
        const selectedCount = Array.isArray(card.selectedShapeIds) ? card.selectedShapeIds.length : 0;
        const annotationCount = Array.isArray(card.annotationIds) ? card.annotationIds.length : 0;
        const modeText = card.mode === "video" ? "图生视频" : "生图/改图";

        setText("title", card.title || "ASUI 画布任务卡片");
        setText("mode", modeText);
        setText("status", card.status || "draft");
        setText("context", `${selectedCount} 节点 / ${annotationCount} 标注`);
        setText("size", card.width && card.height ? `${card.width} × ${card.height}` : "未指定");
        setText("prompt", card.prompt || card.instruction || "等待 ASUI 任务数据。");
        setText("taskId", card.taskId ? `任务 ${card.taskId}` : "尚未绑定任务 ID");

        const thumbWrap = document.querySelector('[data-field="thumbWrap"]');
        const thumb = document.querySelector('[data-field="thumb"]');
        if (card.sourceImageSrc && thumb && thumbWrap) {
          thumb.src = card.sourceImageSrc;
          thumbWrap.style.display = "block";
        }
      }

      render();
      window.addEventListener("message", render);
    </script>
  </body>
</html>
